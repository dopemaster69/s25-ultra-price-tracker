name: Atlas Auto Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  scrape:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ATLAS
        run: |
          python main.py

      - name: Upload Amazon HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-debug
          path: amazon_debug.html

      - name: Commit Updated Files
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"

          git add latest_prices.json
          git add data/prices.db

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update prices"
            git push
          fi